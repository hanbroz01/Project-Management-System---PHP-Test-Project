version: '3.8'

services:
# The PHP Web Server 
  php-web:
    build: .
    ports:
      - "8090:80"   
    volumes:
      - ./public:/var/www/html
    depends_on:
      - mariadb

# The MariaDB Database
  mariadb:
    image: mariadb:latest
    restart: always
    ports:
      - "3307:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_data_test
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data_test:/var/lib/mysql

  # phpMyAdmin for DB management
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8082:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mariadb
    depends_on:
      - mariadb

volumes:
  db_data_test: